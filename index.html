<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100a" />
    <meta name="description" content="Even Realities G2 short interactive novel NO SERVICE" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050906'/%3E%3Cpath d='M6 8h20v4H6zm0 7h14v4H6zm0 7h8v4H6z' fill='%236bff8f'/%3E%3C/svg%3E" />
    <title>圏外 / NO SERVICE</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">EVEN G2 INTERACTIVE FICTION</p>
          <h1>圏外<span>NO SERVICE</span></h1>
        </div>
        <div id="connectionBadge" class="connection-badge" data-state="preview">接続待ち</div>
      </header>

      <section class="experience" aria-label="第1話 届いてる？">
        <div class="episode-meta" aria-hidden="true">
          <span>EPISODE 01</span>
          <strong>届いてる？</strong>
          <span id="storyProgress">01 / 14</span>
        </div>

        <div class="glasses-frame">
          <article id="gameScreen" class="game-screen" data-kind="mail" aria-live="polite">
            <header id="screenHeader" class="screen-header">--:-- / 圏外 / --</header>
            <div class="scanline" aria-hidden="true"></div>
            <div class="screen-content">
              <p id="screenKicker" class="screen-kicker">INBOX RECOVERY</p>
              <h2 id="screenTitle">受信中…</h2>
              <p id="screenBody" class="screen-body">古い通信規格を探索しています。</p>
              <ol id="screenChoices" class="screen-choices" hidden></ol>
              <img id="screenImage" class="screen-image" alt="ミナから届いた粗いモノクロ写真" hidden />
            </div>
            <footer id="screenFooter" class="screen-footer">決定 つぎへ</footer>
          </article>
        </div>

        <div class="control-panel">
          <div class="input-cluster" aria-label="入力シミュレーション">
            <button type="button" data-input="up" aria-label="上">↑</button>
            <button type="button" data-input="down" aria-label="下">↓</button>
            <button type="button" data-input="confirm" class="confirm">決定</button>
            <button type="button" data-input="back" class="back">戻る</button>
          </div>
          <div class="status-cluster">
            <span>LINK STATE</span>
            <strong id="appStatus">INITIALIZING…</strong>
            <small>キーボード: ↑ ↓ Enter Esc</small>
          </div>
          <button id="resetButton" class="reset-button" type="button">最初から</button>
        </div>
      </section>

      <footer class="page-footer">
        <p>最先端の眼鏡に、2008年の携帯メールが届く。</p>
        <span>TEXT / MONO BMP / NO NETWORK</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
